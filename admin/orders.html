<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng - Admin ĐẠT TESLA MOTORS</title>
    
    <link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">
    <link rel="preconnect" href="[fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap)" rel="stylesheet">
    <link rel="stylesheet" href="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="logo">
                <div class="logo-icon">ĐT</div>
                <div class="logo-text" style="color: white;">
                    <span>ADMIN</span>
                    TESLA MOTORS
                </div>
            </div>
            
            <ul class="admin-nav">
                <li><a href="/admin/dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="/admin/products.html"><i class="fas fa-car"></i> Sản phẩm</a></li>
                <li><a href="/admin/orders.html" class="active"><i class="fas fa-shopping-bag"></i> Đơn hàng</a></li>
                <li><a href="/admin/news.html"><i class="fas fa-newspaper"></i> Tin tức</a></li>
                <li><a href="/admin/settings.html"><i class="fas fa-cog"></i> Cài đặt</a></li>
                <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a></li>
            </ul>
        </aside>
        
        <!-- Main Content -->
        <main class="admin-content">
            <div class="admin-header">
                <h1>Quản lý đơn hàng</h1>
            </div>
            
            <!-- Orders Table -->
            <div class="admin-table">
                <table>
                    <thead>
                        <tr>
                            <th>Mã đơn</th>
                            <th>Khách hàng</th>
                            <th>SĐT</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Ngày đặt</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 40px;">
                                <i class="fas fa-spinner fa-spin"></i> Đang tải...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    
    <!-- Order Detail Modal -->
    <div id="orderModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; overflow-y: auto;">
        <div style="max-width: 700px; margin: 50px auto; background: var(--bg-card); border-radius: 20px; padding: 40px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h2>Chi tiết đơn hàng</h2>
                <button onclick="closeModal()" style="background: none; border: none; font-size: 24px; cursor: pointer;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="orderDetail"></div>
        </div>
    </div>
    
    <div class="toast-container"></div>
    
    <script>
        let orders = [];
        
        // Check auth
        fetch('/api/auth/check')
            .then(res => res.json())
            .then(data => {
                if (!data.success) window.location.href = '/admin/login.html';
            })
            .catch(() => window.location.href = '/admin/login.html');
        
        // Load orders
        function loadOrders() {
            fetch('/api/orders')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        orders = data.data;
                        renderOrders();
                    }
                });
        }
        loadOrders();
        
        function renderOrders() {
            const tbody = document.getElementById('ordersTable');
            
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">Chưa có đơn hàng nào</td></tr>';
                return;
            }
            
            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td><strong>${o.order_code}</strong></td>
                    <td>${o.customer_name}</td>
                    <td>${o.customer_phone}</td>
                    <td>${formatCurrency(o.total_amount)}</td>
                    <td>
                        <select onchange="updateStatus(${o.id}, this.value)" class="status-badge ${o.status}" style="border: none; cursor: pointer;">
                            <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>Chờ xử lý</option>
                            <option value="confirmed" ${o.status === 'confirmed' ? 'selected' : ''}>Đã xác nhận</option>
                            <option value="shipping" ${o.status === 'shipping' ? 'selected' : ''}>Đang giao</option>
                            <option value="completed" ${o.status === 'completed' ? 'selected' : ''}>Hoàn thành</option>
                            <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Đã hủy</option>
                        </select>
                    </td>
                    <td>${formatDate(o.created_at)}</td>
                    <td>
                        <button class="action-btn edit" onclick="viewOrder(${o.id})" title="Xem chi tiết">
                            <i class="fas fa-eye"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }
        
        async function viewOrder(id) {
            try {
                const response = await fetch(`/api/orders/${id}`);
                const result = await response.json();
                
                if (result.success) {
                    const order = result.data;
                    document.getElementById('orderDetail').innerHTML = `
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px;">
                            <div>
                                <h4 style="margin-bottom: 15px; color: var(--tesla-red);">Thông tin đơn hàng</h4>
                                <p><strong>Mã đơn:</strong> ${order.order_code}</p>
                                <p><strong>Ngày đặt:</strong> ${formatDate(order.created_at)}</p>
                                <p><strong>Trạng thái:</strong> <span class="status-badge ${order.status}">${getStatusText(order.status)}</span></p>
                                <p><strong>Ghi chú:</strong> ${order.note || 'Không có'}</p>
                            </div>
                            <div>
                                <h4 style="margin-bottom: 15px; color: var(--tesla-red);">Thông tin khách hàng</h4>
                                <p><strong>Họ tên:</strong> ${order.customer_name}</p>
                                <p><strong>SĐT:</strong> ${order.customer_phone}</p>
                                <p><strong>Email:</strong> ${order.customer_email || 'N/A'}</p>
                                <p><strong>Địa chỉ:</strong> ${order.customer_address}</p>
                            </div>
                        </div>
                        
                        <h4 style="margin-bottom: 15px; color: var(--tesla-red);">Sản phẩm</h4>
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr style="background: var(--bg-secondary);">
                                    <th style="padding: 12px; text-align: left;">Sản phẩm</th>
                                    <th style="padding: 12px; text-align: center;">SL</th>
                                    <th style="padding: 12px; text-align: right;">Đơn giá</th>
                                    <th style="padding: 12px; text-align: right;">Thành tiền</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${order.items.map(item => `
                                    <tr style="border-bottom: 1px solid var(--border-color);">
                                        <td style="padding: 12px;">${item.product_name}</td>
                                        <td style="padding: 12px; text-align: center;">${item.quantity}</td>
                                        <td style="padding: 12px; text-align: right;">${formatCurrency(item.price)}</td>
                                        <td style="padding: 12px; text-align: right;">${formatCurrency(item.price * item.quantity)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="3" style="padding: 12px; text-align: right; font-weight: bold;">Tổng cộng:</td>
                                    <td style="padding: 12px; text-align: right; font-weight: bold; color: var(--tesla-red); font-size: 1.2rem;">
                                        ${formatCurrency(order.total_amount)}
                                    </td>
                                </tr>
                            </tfoot>
                        </table>
                    `;
                    document.getElementById('orderModal').style.display = 'block';
                }
            } catch (error) {
                showToast('Không thể tải thông tin đơn hàng', 'error');
            }
        }
        
        async function updateStatus(id, status) {
            try {
                const response = await fetch(`/api/orders/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('Cập nhật trạng thái thành công!', 'success');
                    loadOrders();
                } else {
                    showToast('Lỗi: ' + result.message, 'error');
                }
            } catch (error) {
                showToast('Có lỗi xảy ra', 'error');
            }
        }
        
        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
        }
        
        function formatCurrency(num) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num);
        }
        
        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('vi-VN', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }
        
        function getStatusText(status) {
            const statusMap = {
                'pending': 'Chờ xử lý',
                'confirmed': 'Đã xác nhận',
                'shipping': 'Đang giao',
                'completed': 'Hoàn thành',
                'cancelled': 'Đã hủy'
            };
            return statusMap[status] || status;
        }
        
        function showToast(message, type) {
            const container = document.querySelector('.toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function logout() {
            fetch('/api/auth/logout', { method: 'POST' }).then(() => window.location.href = '/admin/login.html');
        }
        
        // Theme
        const theme = localStorage.getItem('tesla_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
</body>
</html>
